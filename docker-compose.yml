services:
  db:
    image: postgres:16-alpine
    env_file:
      - api/.env
    ports:
      - "5433:5432"
    volumes:
      - tecsa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    entrypoint: ["docker/entrypoint.sh"]
    env_file:
      - api/.env
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tecsa_db_data:
