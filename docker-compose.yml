services:
  db:
    image: postgres:16-alpine
    env_file:
      - api/.env
    ports:
      - "5433:5432"
    volumes:
      - tecsa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    entrypoint: ["docker/entrypoint.sh"]
    env_file:
      - api/.env
    ports:
      - "9000:9000"
    volumes:
      - tecsa_api_vendor:/app/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  tecsa_db_data:
  tecsa_api_vendor:
